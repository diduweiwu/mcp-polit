# MCPilot 多平台打包工作流
#
# 产物与支持的最低系统版本：
# - macOS：universal 单包（dmg + 在线更新包，Intel + Apple Silicon 合一，双击即用、
#   更新免选架构）；macOS 10.15+（Apple Silicon 实际 11+）
# - Windows (x64，NSIS 安装包)：Windows 10+（WebView2 运行时要求；Tauri 2.12 已放弃 Win7/8）
# - Linux (x64，deb/rpm/AppImage)：glibc 2.35+（Ubuntu 22.04+ / Debian 12+ / Fedora 36+）
# 另附各平台裸二进制（bare-bin）。
#
# 触发：推送 v* 标签（同时创建 GitHub Release 并附全部安装包），或手动 workflow_dispatch（仅上传构建产物）。

name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # tag 触发时创建 Release 需要写权限

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal 合包：一个 dmg + 一份在线更新包通吃两种架构
          # （latest.json 的 darwin-aarch64 / darwin-x86_64 都指向 universal 更新包，
          # 代价是更新包体积为双架构合计；换来 CI 只编一轮、下载免选架构）
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: "app,dmg,updater"
          # Windows x64（--bundles 无 "all" 合法值，须显式列出，v0.1.3 实证）；
          # 只留 NSIS 普通安装器——MSI 仅企业批量部署场景，已收敛掉
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: "nsis,updater"
          # Linux x64：用 22.04 构建（glibc 2.35），让产物覆盖尽量多的发行版
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: "deb,rpm,appimage,updater"

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装 Linux 系统依赖（Tauri v2 需要 webkit2gtk-4.1）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 提取 CHANGELOG.md 最新版本段落作为 Release 正文（应用内检查更新的更新日志
      # 显示框同源：latest.json 的 notes 由 scripts/gen-updater-json.mjs 按同一规则
      # 提取）。段落缺失时回退通用文案，不阻塞发版。
      - name: 提取更新日志（CHANGELOG.md 最新段落）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          BODY=$(awk -v tag="${GITHUB_REF_NAME}" '
            BEGIN { t = tag; gsub(/\./, "\\.", t) }
            $0 ~ "^##[[:space:]]+" t "([^0-9.]|$)" { found = 1; next }
            /^##[[:space:]]/ && found { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d')
          {
            echo "RELEASE_BODY<<CHANGELOG_EOF"
            if [ -n "$BODY" ]; then
              printf '%s\n' "$BODY"
            else
              echo "MCPilot 桌面客户端安装包。详见 README 的系统版本要求。"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      # macOS 发布包用自签证书签名（tauri.conf bundle.macOS.signingIdentity = "MCPilot"）：
      # TCC 权限授权锚定证书而非二进制，应用升级不再重置目录授权（ad-hoc 时代的痛点）。
      # 证书 p12（base64）与导出密码走仓库级 Secrets：
      # MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD
      - name: 导入 macOS 签名证书
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/mcpilot-codesign.p12
          security create-keychain -p build build.keychain
          security unlock-keychain -p build build.keychain
          security import /tmp/mcpilot-codesign.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain $(security list-keychains | sed 's/"//g' | tr '\n' ' ')
          security default-keychain -s build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
          rm -f /tmp/mcpilot-codesign.p12
          security find-identity -v -p codesigning

      - name: 构建 & 上传产物
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS：部署目标 10.15（Tauri v2 官方最低；universal 合包时取最小值）
          MACOSX_DEPLOYMENT_TARGET: 10.15
          # 在线更新包签名私钥（GitHub Secrets 配置；泄露即失效，见 README）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          # tag 推送时创建 Release 并附安装包；手动触发时仅上传构建产物
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "MCPilot ${{ github.ref_name }}"
          # Release 正文 = CHANGELOG.md 最新段落（「提取更新日志」步骤写入；
          # 手动触发无该变量，回退通用文案——手动触发不创建 Release，仅占位）
          releaseBody: ${{ env.RELEASE_BODY || 'MCPilot 桌面客户端安装包。详见 README 的系统版本要求。' }}
          releaseDraft: false
          prerelease: false
          # 各 job 一律不再生成 latest.json：多平台并发上传会互相覆盖
          # （v0.1.4 实证 darwin 条目丢失，检查更新报 platforms 找不到），
          # tag 触发时由下方 updater-json job 在全部构建完成后统一汇总
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # tauri-action 只上传安装包，裸可执行文件单独整理上传；按 matrix.target 精确取本 job 的产物
      - name: 整理裸二进制（分架构可执行文件）
        shell: bash
        run: |
          mkdir -p bare-bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "src-tauri/target/${{ matrix.target }}/release/mcpilot.exe" "bare-bin/MCPilot-${{ matrix.target }}.exe"
          else
            cp "src-tauri/target/${{ matrix.target }}/release/mcpilot" "bare-bin/MCPilot-${{ matrix.target }}"
          fi
          ls -l bare-bin

      # tag 触发：裸二进制附加到 Release（gh 已随 runner 预装，checkout 后可识别当前仓库）
      - name: 上传裸二进制到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" bare-bin/* --clobber

      # 手动触发：无 Release，裸二进制作为 workflow Artifacts 供下载
      - name: 上传裸二进制到 Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: bare-bin-${{ matrix.target }}
          path: bare-bin/

  # 汇总生成并上传 latest.json（在线更新索引，应用内「检查更新」拉取
  # Releases/latest/download/latest.json）。
  #
  # 为什么单独一个 job：多平台 job 并发各自上传 latest.json 会互相覆盖，
  # 最后完成者的版本胜出（v0.1.4 实证 macOS 条目丢失）。needs: build 保证
  # 全部产物上传完成后运行：下载 Release 上全部 *.sig 签名，用仓库内
  # scripts/gen-updater-json.mjs 按官方平台键集拼出完整 latest.json 后覆盖上传。
  updater-json:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（复用仓库内生成脚本）
        uses: actions/checkout@v4

      - name: 下载 Release 上各平台更新包签名
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir sigs
          gh release download "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs

      - name: 生成完整 latest.json（含全部平台条目）
        run: node scripts/gen-updater-json.mjs --tag "${GITHUB_REF_NAME}" --sig-dir sigs -o latest.json

      # 任一平台构建失败时不运行（needs 默认要求全部成功）：
      # 旧 latest.json 仍指向旧版本，不会出现指向残缺新版更新包的索引
      - name: 上传覆盖 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" latest.json --clobber
