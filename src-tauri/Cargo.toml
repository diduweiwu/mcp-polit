[package]
name = "mcpilot"
version = "0.1.5"
description = "MCPilot — 本地 MCP 调试工作台（MCP Inspector 客户端）"
authors = ["MCPilot"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mcpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# MCP 官方 Rust SDK：client + stdio 子进程传输 + Streamable HTTP 客户端传输
rmcp = { version = "3.9", features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
# HTTP 头构造（HeaderName/HeaderValue）
http = "1"
# 与 rmcp 内部一致的 reqwest 版本（仅为命名 StreamableHttpClientTransport<reqwest::Client> 类型）
# 显式启用 gzip/brotli/zstd/deflate 解压：部分网关会压缩响应体，未启用时收到压缩字节
# 会导致 rmcp 报「could not parse JSON response」+ 乱码（特性统一后 rmcp 内部 client 同样生效）
reqwest = { version = "0.13", default-features = false, features = [
  "gzip",
  "brotli",
  "zstd",
  "deflate",
] }
# 本地 SQLite 持久化（bundled：静态编译，无系统依赖）
rusqlite = { version = "0.41", features = ["bundled"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-decorum = "1.1.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# 编译速度取舍：codegen-units=16 让代码生成并行执行，lto="thin" 比全量 LTO 快很多；
# 代价是二进制略大（约几个百分点）、运行性能差异可忽略（CI 打包提速明显）
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
