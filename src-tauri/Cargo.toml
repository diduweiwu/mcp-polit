[package]
name = "mcpilot"
version = "0.1.0"
description = "MCPilot — 本地 MCP 调试工作台（MCP Inspector 客户端）"
authors = ["MCPilot"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mcpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# MCP 官方 Rust SDK：client + stdio 子进程传输 + Streamable HTTP 客户端传输
rmcp = { version = "3.9", features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
# HTTP 头构造（HeaderName/HeaderValue）
http = "1"
# 与 rmcp 内部一致的 reqwest 版本（仅为命名 StreamableHttpClientTransport<reqwest::Client> 类型）
reqwest = { version = "0.13", default-features = false }
# 本地 SQLite 持久化（bundled：静态编译，无系统依赖）
rusqlite = { version = "0.41", features = ["bundled"] }

# macOS：直接调整红绿灯按钮的垂直位置（wry 的 y 参数只拉高标题栏容器，不动按钮）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
